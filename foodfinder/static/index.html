<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dish Finder: Nigerian and world foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="wrap">
<div class="auth" id="auth"></div>
<h1>Search any dish. See what's in it.</h1>
<p>Find Nigerian and world foods by name, country or ingredient, then open a dish for its ingredients and nutrition.</p>
<input id="q" type="search" placeholder="Try jollof, beans, onion or soup" aria-label="Search dishes or ingredients" autocomplete="off">
<div id="chips" role="group" aria-label="Filter by country"></div>
</div></header>
<main><div class="wrap">
<div class="bar"><span id="count" aria-live="polite"></span>
<label>Sort <select id="sort"><option value="az">A to Z</option><option value="cal">Fewest calories</option><option value="pro">Most protein</option></select></label></div>
<div id="list"></div>
<footer>Nutrition values are rough per-serving estimates. Check them against a food composition database before relying on them.</footer>
</div></main>

<dialog id="dlg-auth" aria-labelledby="atitle"><form id="f-auth">
<h2 id="atitle">Log in</h2>
<label>Username<input name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username"></label>
<label>Password (8 or more characters)<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
<p class="err" id="aerr" role="alert"></p>
<div class="act"><button class="link" type="button" id="aswitch"></button><button class="btn" type="button" data-close>Cancel</button><button class="btn pri" id="asubmit"></button></div>
</form></dialog>

<dialog id="dlg-add" aria-labelledby="addtitle"><form id="f-add">
<h2 id="addtitle">Add a dish</h2>
<label>Name<input name="name" required maxlength="80"></label>
<label>Country<input name="country" required maxlength="60"></label>
<label>Type (soup, snack, main dish...)<input name="type" maxlength="40"></label>
<label>Description<textarea name="description" rows="2" maxlength="500"></textarea></label>
<label>How it's eaten<textarea name="how_eaten" rows="2" maxlength="500"></textarea></label>
<label>Tags, separated by commas<input name="tags" placeholder="rice, spicy"></label>
<label>Ingredients, one per line as name, quantity<textarea name="ingredients" rows="4" required placeholder="Rice, 3 cups&#10;Onion, 2 medium"></textarea></label>
<label>Nutrition per serving</label>
<div class="grid4">
<label>Calories<input name="calories" type="number" min="0" max="5000" step="1" required></label>
<label>Protein (g)<input name="protein" type="number" min="0" step="any" required></label>
<label>Carbs (g)<input name="carbs" type="number" min="0" step="any" required></label>
<label>Fat (g)<input name="fat" type="number" min="0" step="any" required></label>
</div>
<p class="err" id="eadd" role="alert"></p>
<div class="act"><button class="btn" type="button" data-close>Cancel</button><button class="btn pri">Save dish</button></div>
</form></dialog>
<script src="app.js"></script>
</body>
</html>
